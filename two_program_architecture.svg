<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Multiple sensors including cameras, an EEG amplifier, and an additional sensor stream data over local WiFi using LSL to a headless hub program running on a mini PC at the patient's home. A separate full control program on a laptop or PC connects to the hub over WiFi on-site or remotely later.</desc>
